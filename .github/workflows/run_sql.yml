name: Run SQL DDL

on: [push]

permissions:
  contents: write

jobs:
  run-sql:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install psycopg2-binary

      - name: Run SQL Script
        if: ${{ env.DATABASE_URL != '' }}
        run: |
          python run_sql.py

      - name: Skip when database URL is unavailable
        if: ${{ env.DATABASE_URL == '' }}
        run: |
          echo "Skipping SQL DDL run because DATABASE_URL secret is not configured."

      - name: Commit and Push output
        if: ${{ env.DATABASE_URL != '' }}
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add db_tables.txt
          git commit -m "chore: save database tables list [skip ci]" || exit 0
          git push
