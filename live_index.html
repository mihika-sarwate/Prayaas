<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sankalp - Field Force Management System (Adonis Laboratories)</title>
<link rel="icon" type="image/jpeg" href="logo.jpg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script>
async function runFullFix() {
  if (typeof supabase === "undefined" || !supabase || !supabase.from) {
    console.log("Waiting for supabase client...");
    setTimeout(runFullFix, 1000);
    return;
  }
  
  if (localStorage.getItem("fix_applied") === "true") return;

  console.log("1. Migrating old names in Supabase...");
  const renames = {
    "MV 30 Syrup": "MV30 SYRUP",
    "MV 30 Tab": "MV30 TAB",
    "Coldaid+": "COLDAID",
    "Aminoglobin-XT Susp": "Aminoglobin-XT",
    "Arden A": "Arden-A",
    "Hepaheal Syrup": "Hepa-heal",
    "Servil LS-Baby": "Servil-LS Baby Drops"
  };

  for (let oldName of Object.keys(renames)) {
    let newName = renames[oldName];
    try {
      await supabase
        .from("samples_inventory")
        .update({ prod_name: newName })
        .eq("prod_name", oldName);
    } catch(e){}
  }

  console.log("2. Fetching maximum IDs to bypass sequence error...");
  let sData = await supabase.from("samples_inventory").select("id").order("id", { ascending: false }).limit(1);
  let maxSId = (sData.data && sData.data.length > 0) ? parseInt(sData.data[0].id) : 0;
  
  if (window.DB && window.DB.samplesInventory) {
    window.DB.samplesInventory.forEach(item => {
      if (typeof item.id === "string" && !/^\d+$/.test(item.id)) {
        maxSId++;
        item.id = maxSId;
      }
    });
  }

  let gData = await supabase.from("gifts_inventory").select("id").order("id", { ascending: false }).limit(1);
  let maxGId = (gData.data && gData.data.length > 0) ? parseInt(gData.data[0].id) : 0;
  
  if (window.DB && window.DB.giftsInventory) {
    window.DB.giftsInventory.forEach(item => {
      if (typeof item.id === "string" && !/^\d+$/.test(item.id)) {
        maxGId++;
        item.id = maxGId;
      }
    });
  }

  localStorage.setItem("adonis_db", JSON.stringify(window.DB));
  localStorage.setItem("fix_applied", "true");
  
  console.log("3. Initiating final Sync...");
  if (window.syncDatabase) {
    await window.syncDatabase();
  }
  alert("All fixes applied successfully! The database is now fully synced.");
}
setTimeout(runFullFix, 1000);
</script></body></html>
